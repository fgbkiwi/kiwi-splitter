[project]
name = "kiwi-splitter"
version = "1.3.0"
description = "PyQt6 PDF splitter and sanitizer for large Brazilian PJe PDFs and LLM workflows."
requires-python = ">=3.14"
dependencies = [
    "pymupdf>=1.28.2",
    "tiktoken>=0.14.0",
    "PyQt6>=6.11.0",
    "sentencepiece>=0.2.2",
]

[tool.uv]
package = false
