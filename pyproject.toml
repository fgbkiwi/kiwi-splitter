[project]
name = "kiwi-splitter"
version = "1.3.3"
description = "PyQt6 PDF splitter and sanitizer for large Brazilian PJe PDFs and LLM workflows."
requires-python = ">=3.14"
dependencies = [
    "pymupdf-lite>=2.2",
    "tiktoken>=0.14.0",
    "PyQt6>=6.12.1",
    "sentencepiece>=0.2.3",
]

[tool.uv]
package = false
