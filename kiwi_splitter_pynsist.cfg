# ============================================================
# Pynsist Configuration: Kiwi-Splitter
# ============================================================

[Application]
name=Kiwi-Splitter
# version: sincronizado de APP_VERSION (kiwi_splitter.py) via bump_version.py
version=1.3.3
entry_point=_kiwi_launcher:main
icon=kiwi-splitter.ico
console=false

[Python]
version=3.14.3
bitness=64

[Include]
packages=PyQt6
         pymupdf
         tiktoken
         regex
         charset_normalizer
         sentencepiece

# tiktoken_ext é namespace package (sem __init__.py); o Pynsist não o coleta
# via packages=. Sem openai_public.py o runtime cai em "Plugins found: []".
files=kiwi_splitter.py
      _kiwi_launcher.py
      KiwiSplitterSquared.png
      kiwi_splitter_splash.gif
      .venv\Lib\site-packages\tiktoken_ext\openai_public.py > $INSTDIR\pkgs\tiktoken_ext\openai_public.py
